<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>二人の掟</title>
<meta name="theme-color" content="#000000">
<meta name="app-build" content="20260930-160036">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="description" content="桃香と理央の掟。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="二人の掟">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 44'%3E%3Cpath d='M0 0h6.4l11.2 31.4V0H24v44h-6.4L6.4 12.6V44H0z' fill='%23E50914'/%3E%3C/svg%3E">
<style>html,body{margin:0;background:#000}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root{
    --nf:#E50914; --nf-dark:#B20710;
    --bk:#000000; --card:#141414; --card2:#1F1F1F;
    --wh:#FFFFFF; --g1:#E5E5E5; --g2:#B3B3B3; --g3:#808080; --g4:#404040;
    --grn:#46D369;
    --f:"Noto Sans JP","Hiragino Sans",sans-serif;
    --tabh:58px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html{background:#000000}
  body{
    background:var(--bk);color:var(--wh);font-family:var(--f);font-weight:500;
    font-size:13px;line-height:1.6;margin:0;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:var(--f);color:inherit;background:none;border:0;padding:0;cursor:pointer;
    touch-action:manipulation;transition:transform .12s var(--ease),opacity .12s}
  .tnum{font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* ===================== モーション ===================== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes sheetUp{from{transform:translateY(100%);opacity:.4}to{transform:none;opacity:1}}
  @keyframes popIn{0%{transform:scale(.55);opacity:0}62%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
  @keyframes logoIn{0%{transform:scale(1.5);opacity:0;letter-spacing:.24em}
    55%{opacity:1}100%{transform:scale(1);opacity:1;letter-spacing:-.03em}}
  @keyframes railIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}
    38%{transform:translateX(6px)}58%{transform:translateX(-4px)}78%{transform:translateX(3px)}}
  @keyframes redflash{0%{box-shadow:0 0 0 0 rgba(229,9,20,.85)}100%{box-shadow:0 0 0 26px rgba(229,9,20,0)}}
  @keyframes sweep{from{background-position:-160% 0}to{background-position:260% 0}}
  @keyframes barGrow{from{width:0}}

  #screen>.sect{animation:fadeUp .46s var(--ease) both}
  #screen>.sect:nth-child(1){animation-delay:.02s}
  #screen>.sect:nth-child(2){animation-delay:.08s}
  #screen>.sect:nth-child(3){animation-delay:.14s}
  #screen>.sect:nth-child(4){animation-delay:.20s}
  #screen>.sect:nth-child(5){animation-delay:.26s}
  .rail>*{animation:railIn .44s var(--ease) both}
  .rail>*:nth-child(1){animation-delay:.04s}
  .rail>*:nth-child(2){animation-delay:.10s}
  .rail>*:nth-child(3){animation-delay:.16s}
  .rail>*:nth-child(4){animation-delay:.22s}
  .rail>*:nth-child(5){animation-delay:.28s}
  #detail.open{animation:sheetUp .36s var(--ease) both}
  #detail .d-body{animation:fadeIn .5s .14s both}
  #detail .hero{animation:fadeIn .5s both}
  .poster:active,.top3:active,.wide:active{transform:scale(.945)}
  .prof:active{transform:scale(.94)}
  .bigbtn:active{transform:scale(.985)}
  .tb:active svg{transform:scale(.86)}
  .epi{transition:background .15s}
  .epi:active{background:#0E0E0E}

  /* ===================== プロフィール選択 ===================== */
  #gate{position:fixed;inset:0;background:var(--bk);z-index:60;overflow-y:auto;display:flex;flex-direction:column}
  .gate-art{position:relative;height:44vh;min-height:270px;flex:none;overflow:hidden}
  .gate-art .veil{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.55) 60%,#000 100%)}
  .gate-logo{position:absolute;left:0;right:0;bottom:24px;text-align:center;
    animation:logoIn 1.15s var(--ease) both}
  .gate-logo .t1{font-weight:900;font-size:41px;letter-spacing:-.03em;line-height:1}
  .gate-logo .t2{color:var(--nf);font-style:italic}
  .gate-fill{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:6vh;
    animation:fadeUp .6s .5s both}
  .gate-sub{text-align:center;color:var(--g2);font-size:13px;margin:0 0 22px}
  .profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 26px;
    padding:0 46px 40px;max-width:420px;margin:0 auto;width:100%}
  .prof{display:flex;flex-direction:column;align-items:center;gap:9px}
  .prof .av{width:88px;height:88px;border-radius:8px;display:grid;place-content:center;overflow:hidden}
  .prof .nm{font-size:12.5px;color:var(--g2)}
  .av-momoka{background:linear-gradient(145deg,#FF2D87,#C4006B)}
  .av-rio{background:linear-gradient(145deg,#3AA0FF,#0B4FBF)}
  .av-add,.av-edit{background:var(--card2);border:1px solid #2E2E2E}
  .av svg{width:46px;height:46px}

  /* ===================== 共通 ===================== */
  #app{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 8px)}
  .nav{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#000 30%,rgba(0,0,0,.72) 100%);
    backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:12px 16px 10px}
  .nav h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
  .nav-ic{display:flex;gap:18px;align-items:center}
  .nav-ic svg{width:22px;height:22px;display:block}
  .nlogo{width:19px;height:34px;flex:none}
  .bill{margin:8px 16px 0;border-radius:12px;padding:20px 18px 18px;position:relative;overflow:hidden;
    background:linear-gradient(140deg,#5E040C 0%,#C20710 52%,#FF2E3C 100%);
    box-shadow:0 10px 28px rgba(229,9,20,.28);animation:fadeUp .5s var(--ease) both}
  .bill::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    border-radius:50%;background:rgba(255,255,255,.08)}
  .bill .eb{font-size:9.5px;letter-spacing:.3em;font-weight:700;color:rgba(255,255,255,.82);
    position:relative;z-index:1}
  .bill .n{font-size:52px;font-weight:900;line-height:1;margin:7px 0 0;position:relative;z-index:1}
  .bill .n small{font-size:15px;font-weight:700;margin-left:7px}
  .bill ul{margin:13px 0 0;padding:0;list-style:none;position:relative;z-index:1}
  .bill li{font-size:13px;font-weight:700;line-height:1.5;padding:8px 0;
    border-top:1px solid rgba(255,255,255,.28);display:flex;gap:8px;align-items:flex-start}
  .bill li i{font-style:normal;font-size:9.5px;font-weight:700;background:rgba(0,0,0,.28);
    border-radius:99px;padding:2px 7px;flex:none;margin-top:1px}
  .bill .go{margin-top:15px;background:#fff;color:#000;border-radius:4px;min-height:44px;width:100%;
    font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;
    position:relative;z-index:1}
  .bill .go svg{width:17px;height:17px}
  .bill.other{background:linear-gradient(140deg,#161033 0%,#2C2160 52%,#4B36A8 100%);
    box-shadow:0 10px 28px rgba(76,54,168,.3);margin-top:12px}
  .bill.other::after{background:rgba(255,255,255,.07)}
  .sect{margin-top:22px}
  .sect h2{font-size:15.5px;font-weight:700;margin:0 0 9px;padding-inline:16px;letter-spacing:-.01em}
  .rail{display:flex;gap:8px;overflow-x:auto;padding:0 16px 3px;scrollbar-width:none;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{display:none}
  .rail>*{flex:none;scroll-snap-align:start}

  /* ===================== アート ===================== */
  .art{position:relative;overflow:hidden;border-radius:4px;display:block;width:100%;height:100%}
  .art .mo{position:absolute;inset:0;width:100%;height:100%}
  .art .cap{position:absolute;left:8px;right:8px;bottom:9px}
  .art .cap .ct{font-weight:900;font-size:15px;line-height:1.12;letter-spacing:-.02em;
    text-shadow:0 2px 10px rgba(0,0,0,.65)}
  .art .cap .cs{font-size:8.5px;color:var(--g2);letter-spacing:.16em;margin-top:4px;font-weight:700}
  .a-reply{background:radial-gradient(118% 88% at 70% 18%,#8C0D18 0%,#38040A 52%,#080002 100%)}
  .a-plan{background:radial-gradient(120% 92% at 50% 88%,#FF9500 0%,#7A2E00 46%,#0B0603 100%)}
  .a-eye{background:radial-gradient(118% 88% at 50% 32%,#4436A8 0%,#171041 54%,#04030E 100%)}
  .a-lie{background:radial-gradient(118% 88% at 50% 30%,#0E5A54 0%,#062724 52%,#020A09 100%)}
  .poster{width:108px;aspect-ratio:2/3;border-radius:4px;overflow:hidden;position:relative}
  .poster .badge{position:absolute;top:0;left:0;background:var(--nf);font-size:8px;font-weight:700;
    padding:2px 5px;letter-spacing:.06em;border-radius:0 0 3px 0}
  .top3{display:flex;align-items:flex-end;padding-left:2px}
  .rank{font-weight:900;font-size:96px;line-height:.78;color:#0D0D0D;
    -webkit-text-stroke:2px #5A5A5A;letter-spacing:-.06em;margin-right:-8px}
  .top3 .poster{width:100px}
  .wide{width:232px;display:flex;flex-direction:column;text-align:left}
  .wide .th{aspect-ratio:16/9;border-radius:4px;overflow:hidden;position:relative}
  .wide .pl{position:absolute;inset:0;display:grid;place-content:center}
  .wide .pl span{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.9);
    display:grid;place-content:center;background:rgba(0,0,0,.35)}
  .wide .pl svg{width:15px;height:15px;margin-left:2px}
  .prog{height:3px;background:#4a4a4a;margin-top:7px;border-radius:2px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--nf)}
  .wide .tt{font-size:11.5px;margin-top:6px;color:var(--g1);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wide .mt{font-size:10.5px;color:var(--g3);margin-top:2px}

  /* ===================== 詳細 ===================== */
  #detail{position:fixed;inset:0;background:var(--bk);z-index:50;overflow-y:auto;
    padding-bottom:calc(var(--tabh) + 30px)}
  .hero{position:relative;aspect-ratio:1/1;max-height:60vh}
  .hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,.85) 88%,#000 100%)}
  .hero .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
    background:rgba(20,20,20,.72);display:grid;place-content:center}
  .hero .x svg{width:15px;height:15px}
  .hero .mute{position:absolute;right:14px;bottom:14px;width:30px;height:30px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.55);display:grid;place-content:center}
  .hero .mute svg{width:14px;height:14px}
  .d-body{padding:14px 16px 0;margin-top:-6px}
  .d-eyebrow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .d-eyebrow .w{font-size:10.5px;letter-spacing:.42em;color:var(--g1);font-weight:700}
  .d-title{font-size:26px;font-weight:900;letter-spacing:-.025em;line-height:1.16;margin:0 0 9px}
  .d-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--g2);margin-bottom:14px}
  .d-meta .mm{color:var(--grn);font-weight:700}
  .tagbox{border:1px solid var(--g4);color:var(--g1);font-size:9.5px;padding:0 4px;border-radius:2px;font-weight:700}
  .tagfill{background:var(--g4);color:var(--g1);font-size:9.5px;padding:0 4px;border-radius:2px;font-weight:700}
  .bigbtn{width:100%;min-height:46px;border-radius:4px;font-weight:700;font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:9px}
  .bigbtn svg{width:19px;height:19px}
  .b-play{background:var(--wh);color:#000}
  .b-sub{background:#2A2A2A;color:var(--wh)}
  .b-red{background:var(--nf);color:#fff}
  .b-red.pulse{animation:redflash .6s ease-out}
  .timeline{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  .timeline .bar{flex:1;height:3px;background:#4a4a4a;border-radius:2px;overflow:hidden}
  .timeline .bar i{display:block;height:100%;background:var(--nf);animation:barGrow .6s var(--ease)}
  .timeline .lb{font-size:10.5px;color:var(--g2);white-space:nowrap}
  .d-sub{font-size:13.5px;line-height:1.62;color:var(--g1);margin:0 0 12px}
  .d-credit{font-size:11.5px;color:var(--g3);line-height:1.7;margin-bottom:4px}
  .d-credit b{color:var(--g1);font-weight:500}
  .acts{display:flex;gap:34px;padding:16px 4px 18px}
  .act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--g1)}
  .act svg{width:23px;height:23px}
  .act.on svg{color:var(--nf)}
  .tabs{display:flex;gap:20px;border-top:1px solid #222;padding-top:2px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{font-size:13.5px;font-weight:700;color:var(--g3);padding:13px 0 11px;position:relative;white-space:nowrap}
  .tabs button[aria-selected="true"]{color:var(--wh)}
  .tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:0;right:0;height:3px;background:var(--nf)}
  .epi{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #191919;align-items:flex-start;width:100%;text-align:left}
  .epi .th{width:108px;aspect-ratio:16/9;border-radius:3px;overflow:hidden;flex:none;position:relative}
  .epi .th .ov{position:absolute;inset:0;background:rgba(0,0,0,.32)}
  .epi .th .dn{position:absolute;inset:0;display:grid;place-content:center;font-weight:900;
    font-size:22px;color:rgba(255,255,255,.94);text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .epi .in{flex:1;min-width:0}
  .epi .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
  .epi .h .du{color:var(--g3);font-weight:500;font-size:11px;flex:none}
  .epi .d{font-size:11.5px;color:var(--g3);line-height:1.5;margin-top:3px}
  .epi .st{display:inline-flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .pill{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:99px}
  .p-ok{background:rgba(70,211,105,.15);color:var(--grn)}
  .p-ng{background:rgba(229,9,20,.18);color:#FF6470}
  .p-na{background:#1E1E1E;color:var(--g3)}

  /* 罰ゲーム抽選（違反時に自動で出る） */
  /* 罰ゲームが届いたときの全面表示 */
  .ack{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.93);display:flex;
    align-items:center;justify-content:center;padding:22px;overflow-y:auto;
    animation:fadeIn .3s both}
  .ackbox{width:100%;max-width:380px;background:#141414;border:1px solid #2A1014;
    border-radius:12px;padding:22px 18px 18px;animation:popIn .42s var(--ease) both}
  .ackbox .eb{font-size:10px;letter-spacing:.34em;color:var(--nf);font-weight:700;margin-bottom:8px}
  .ackbox h3{font-size:21px;font-weight:900;margin:0 0 4px;line-height:1.3}
  .ackbox .sb{font-size:11.5px;color:var(--g3);margin:0 0 16px;line-height:1.6}
  .ackitem{background:#1C1C1C;border-radius:8px;padding:14px;margin-bottom:10px}
  .ackitem .at{font-size:15px;font-weight:900;line-height:1.5}
  .ackitem .am{font-size:10.5px;color:var(--g3);margin-top:5px}
  .ackitem .bigbtn{margin:12px 0 0;min-height:42px;font-size:14px}
  .pen.nw{background:rgba(229,9,20,.07)}
  .pen.nw .px{background:var(--nf);color:#fff}
  .tbwrap{position:relative;display:inline-flex}
  .tbdot{position:absolute;top:-4px;right:-9px;min-width:16px;height:16px;border-radius:99px;
    background:var(--nf);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-content:center;
    padding:0 4px;line-height:1}
  /* ===================== カレンダー ===================== */
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 12px}
  .cal-head .m{font-size:17px;font-weight:900}
  .navb{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-content:center}
  .navb svg{width:14px;height:14px}
  .navb[disabled]{opacity:.28}
  .g7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding-inline:16px}
  .dow{font-size:9.5px;color:var(--g3);text-align:center;font-weight:700;padding-bottom:4px}
  .dow.s{color:#FF6470}
  .day{aspect-ratio:1;border-radius:4px;background:#121212;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--g1);
    border:1.5px solid transparent}
  .day.void{background:transparent;pointer-events:none}
  .day.fut{opacity:.3;pointer-events:none}
  .day.today{border-color:var(--nf)}
  .day.sel{background:var(--wh);color:#000}
  .day .mk{display:flex;gap:3px;height:5px;align-items:center}
  .day .mk i{width:5px;height:5px;border-radius:50%;display:block}
  .mk .g{background:var(--grn)} .mk .r{background:var(--nf)}
  .day.sel .mk .g{background:#0A8C31}
  .edit{margin:18px 16px 0;background:var(--card);border-radius:8px;padding:14px 14px 6px;
    animation:fadeUp .36s var(--ease) both}
  .edit h3{font-size:14px;font-weight:900;margin:0 0 10px}
  .erow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 0;border-bottom:1px solid #202020;font-size:12.5px}
  .erow:last-child{border-bottom:0}
  .erow .lb{color:var(--g1);min-width:0}
  .erow .lb i{display:block;font-style:normal;font-size:10px;color:var(--g3);margin-top:1px}
  .step{display:flex;align-items:center;gap:9px;flex:none}
  .step button{width:30px;height:30px;border-radius:50%;background:var(--card2);font-weight:900;
    font-size:15px;line-height:1;display:grid;place-content:center}
  .step .v{font-weight:900;font-size:15px;min-width:16px;text-align:center}
  .tg{border-radius:99px;padding:6px 14px;font-size:11.5px;font-weight:700;background:var(--card2);color:var(--g2);flex:none}
  .tg[aria-pressed="true"]{background:var(--wh);color:#000}

  /* ===================== マイリスト ===================== */
  .prow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #181818;
    animation:fadeUp .4s var(--ease) both}
  .prow .ix{width:46px;height:46px;border-radius:4px;background:var(--card2);display:grid;place-content:center;
    flex:none;font-weight:900;font-size:17px;color:var(--nf)}
  .prow .in{flex:1;min-width:0}
  .prow .t{font-size:13px;font-weight:700;line-height:1.4}
  .prow .s{font-size:10.5px;color:var(--g3);margin-top:2px}
  .prow .ck{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--g3);display:grid;place-content:center;flex:none}
  .prow .ck svg{width:15px;height:15px}
  .prow .ck:active{background:var(--wh);color:#000}
  .addbox{margin:0 16px;background:var(--card);border-radius:8px;padding:14px}
  .addbox input{width:100%;background:#1F1F1F;border:1px solid #2E2E2E;border-radius:4px;color:#fff;
    font-size:16px;font-family:var(--f);font-weight:500;padding:12px;outline:none;-webkit-appearance:none}
  .addbox input:focus{border-color:var(--g3)}
  .addbox input::placeholder{color:#6A6A6A}

<script>
(function(){
/* ===================== 状態 ===================== */
/* ===================== 共有エンジン（イベントログ＋同期） ===================== */
var SB_URL='https://pargoxyoykxwvpsfbthc.supabase.co';

var EV=[], SEEN={}, S={}, LOC={}, sync={on:null,busy:0,again:0,pt:null};
try{ EV=JSON.parse(localStorage.getItem(LKEY))||[]; }catch(e){ EV=[]; }
try{ LOC=JSON.parse(localStorage.getItem(LLOC))||{}; }catch(e){ LOC={}; }
EV.forEach(function(e){ if(e&&e.i) SEEN[e.i]=1; });
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function saveLocal(){ try{ localStorage.setItem(LKEY,JSON.stringify(EV));
  localStorage.setItem(LLOC,JSON.stringify(LOC)); }catch(e){} }
function save(){ saveLocal(); push(); }
/* 受け取ったイベントは全て検証する。行は誰でも書けるので、中身を信用しない */
var KINDS={'v':1,'v-':1,'s':1,'pa':1,'pd':1,'pn':1,'pc':1,'pu':1,'pv':1,'pk':1,'f':1,'rt':1,'zz':1};
var WHO={momoka:1,rio:1}, RID={reply:1,plan:1,eye:1,lie:1}, TG={both:1,momoka:1,rio:1};
function sid(x){ return (typeof x==='string'&&/^[A-Za-z0-9_.:-]{1,64}$/.test(x))?x:null; }
function stx(x,n){ return (typeof x==='string'&&x.length>0&&x.length<=n)?x:null; }
function isDay(x){ return typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x); }
function okEv(e){
  if(!e||typeof e!=='object') return null;
  if(!sid(e.i)||!KINDS[e.k]||typeof e.t!=='number'||!isFinite(e.t)) return null;
  var o={i:e.i,k:e.k,t:e.t};
  if(e.w!==undefined){ if(!WHO[e.w]) return null; o.w=e.w; }
  if(e.k==='v'||e.k==='v-'){ if(!o.w||!isDay(e.d)||!RID[e.r]) return null; o.d=e.d; o.r=e.r; }
  else if(e.k==='s'){ if(!o.w||!isDay(e.d)) return null; o.d=e.d; o.v=!!e.v; }
  else if(e.k==='pa'){ if(!sid(e.id)||!stx(e.tx,200)||!TG[e.tg]) return null;
    o.id=e.id; o.tx=e.tx; o.tg=e.tg; }
  else if(e.k==='pd'||e.k==='pc'||e.k==='pu'||e.k==='pv'||e.k==='pk'){ if(!sid(e.id)) return null; o.id=e.id; }
  else if(e.k==='pn'){ if(!o.w||!sid(e.id)||!stx(e.tx,200)) return null;
    o.id=e.id; o.tx=e.tx;
    if(e.g!==undefined){ if(!WHO[e.g]) return null; o.g=e.g; }
    o.no=(typeof e.no==='number'&&e.no>=0&&e.no<=999)?(e.no|0):0;
    o.d=stx(e.d,12)||''; }
  else if(e.k==='f'||e.k==='rt'){ if(!RID[e.r]) return null; o.r=e.r; o.v=!!e.v; }
  return o;
}
function unionEv(list){ var ch=0;
  if(!list||typeof list.length!=='number'||list.length>20000) return 0;
  for(var i=0;i<list.length;i++){ var e=okEv(list[i]);
    if(e&&!SEEN[e.i]){ SEEN[e.i]=1; EV.push(e); ch=1; } }
  return ch; }
function addEv(e){ e.i=e.i||uid(); e.t=e.t||Date.now();
  var v=okEv(e); if(!v||SEEN[v.i]) return e;
  SEEN[v.i]=1; EV.push(v); fold(); saveLocal(); push(); return e; }

function fold(){
  EV.sort(function(a,b){ return (a.t||0)-(b.t||0); });
  var cut=0; EV.forEach(function(e){ if(e.k==='zz'&&e.t>cut) cut=e.t; });
  var days={}, pool=[], del={}, pn={}, st={}, ack={}, fav={}, rate={};
  DEF.forEach(function(t,i){ pool.push({id:'d'+i,text:t,target:'both',by:null}); });
  function D(k){ if(!days[k]) days[k]={v:{momoka:{},rio:{}},sent:{}}; return days[k]; }
  EV.forEach(function(e){
    if(e.t<cut||e.k==='zz') return;
    if(e.k==='v'){ var o=D(e.d).v[e.w]; o[e.r]=(o[e.r]||0)+1; }
    else if(e.k==='v-'){ var o2=D(e.d).v[e.w]; o2[e.r]=Math.max(0,(o2[e.r]||0)-1); }
    else if(e.k==='s'){ D(e.d).sent[e.w]=!!e.v; }
    else if(e.k==='pa'){ pool.push({id:e.id,text:e.tx,target:e.tg,by:e.w}); }
    else if(e.k==='pd'){ del[e.id]=1; }
    else if(e.k==='pn'){ pn[e.id]={id:e.id,who:e.w,no:e.no,text:e.tx,date:e.d,t:e.t,by:e.g||null}; }
    else if(e.k==='pv'){ ack[e.id]=1; }
    else if(e.k==='pc'){ st[e.id]='done'; }
    else if(e.k==='pu'){ st[e.id]='open'; }
    else if(e.k==='pk'){ st[e.id]='cancel'; }
    else if(e.k==='f'){ fav[e.r]=!!e.v; }
    else if(e.k==='rt'){ rate[e.r]=!!e.v; }
  });
  var pending=[], doneList=[], newList=[], doneN={momoka:0,rio:0}, id;
  for(id in pn){
    if(st[id]==='cancel') continue;
    var it=pn[id];
    if(st[id]==='done'){ doneList.push(it); doneN[it.who]=(doneN[it.who]||0)+1; }
    else if(it.by&&!ack[id]) newList.push(it);   /* 相手から届いた・未確認 */
    else pending.push(it);
  }
  function byT(a,b){ return (b.t||0)-(a.t||0); }
  pending.sort(byT); doneList.sort(byT); newList.sort(byT);
  S={days:days,pool:pool.filter(function(p){ return !del[p.id]; }),
     pending:pending,doneList:doneList,newList:newList,fav:fav,rate:rate,doneN:doneN};
}
function pad(n){ return String(n).padStart(2,'0'); }
function ds(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return ds(new Date()); }
function vio(k,who,rid){ var r=S.days[k]; return (r&&r.v&&r.v[who]&&r.v[who][rid])||0; }
function sent(k,who){ var r=S.days[k]; return !!(r&&r.sent&&r.sent[who]); }

/* ---- Supabase 同期（ライブラリなし・3秒ごと） ---- */
function H(x){ var h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
  for(var k in (x||{})) h[k]=x[k]; return h; }
function paintSync(){
  var el=document.getElementById('syncbar'); if(!el) return;
  if(sync.on===true){ el.className='syncbar ok'; el.innerHTML='<i></i>二人で同期中'; }
  else if(sync.on===false){ el.className='syncbar ng'; el.innerHTML='<i></i>つながっていません ─ この端末に保存中'; }
  else { el.className='syncbar'; el.innerHTML='<i></i>接続中…'; }
}
function pull(){
  if(typeof fetch!=='function') return;
  fetch(SB_URL+'/rest/v1/okite_state?id=eq.'+ROOM+'&select=data',{headers:H(),cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(j){
    sync.on=true;
    var row=j&&j[0], rev=(row&&row.data&&row.data.ev)||null;
    if(rev){ var before=EV.length;
      if(unionEv(rev)){ fold(); saveLocal(); render(); }
      if(rev.length<EV.length||before!==EV.length) push();
    } else { push(); }
    paintSync();
  })
  .catch(function(){ sync.on=false; paintSync(); });
}
function push(){
  if(sync.pt) return;
  sync.pt=setTimeout(function(){ sync.pt=null; doPush(); },500);
}
function doPush(){
  if(typeof fetch!=='function') return;
  if(sync.busy){ sync.again=1; return; }
  sync.busy=1;
  fetch(SB_URL+'/rest/v1/okite_state',{method:'POST',
    headers:H({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify([{id:ROOM,data:{ev:EV},updated_at:new Date().toISOString()}])})
  .then(function(r){ sync.on=!!r.ok; })
  .catch(function(){ sync.on=false; })
  .then(function(){ sync.busy=0; paintSync();
    if(sync.again){ sync.again=0; doPush(); } });
}

/* ===================== 集計 ===================== */
function totalVio(who,rid){ var n=0; for(var k in S.days){
  var v=S.days[k].v&&S.days[k].v[who]; if(!v) continue;
  if(rid){ n+=v[rid]||0; } else { for(var x in v) n+=v[x]||0; } } return n; }
function pend(who){ return S.pending.filter(function(p){ return p.who===who; }); }
function firstDay(){ var m=null; for(var k in S.days){ if(!m||k<m) m=k; } return m; }
function monthBad(rid){
  var pre=vY+'-'+pad(vM+1), n=0, f=firstDay(), t=today();
  if(rid==='plan'){
    if(!f) return 0;
    var dim=new Date(vY,vM+1,0).getDate();
    for(var d=1;d<=dim;d++){ var k=vY+'-'+pad(vM+1)+'-'+pad(d);
      if(k<f||k>=t) continue;
      if(!sent(k,'momoka')) n++; if(!sent(k,'rio')) n++; }
    return n;
  }
  for(var key in S.days){ if(key.indexOf(pre)!==0) continue;
    n+=vio(key,'momoka',rid)+vio(key,'rio',rid); }
  return n;
}
function streak(who){ var n=0, now=new Date();
  for(var i=0;i<500;i++){ var k=ds(new Date(now.getTime()-i*86400000));
    if(sent(k,who)) n++; else if(i===0) continue; else break; } return n; }
function keep(rid,who){ var bad=0, now=new Date(), t=today(), f=firstDay();
  for(var i=0;i<30;i++){ var k=ds(new Date(now.getTime()-i*86400000));
    if(f&&k<f) continue;
    if(rid==='plan'){ if(!sent(k,who)&&k<t) bad++; }
    else if(vio(k,who,rid)>0) bad++; }
  return Math.max(0,Math.round((30-bad)/30*100));
}

function addVio(who,rid,k){ addEv({k:'v',w:who,d:k,r:rid}); return true; }
function subVio(who,rid,k){
  if(vio(k,who,rid)<=0) return false;
  addEv({k:'v-',w:who,d:k,r:rid}); return true;
}

/* ===================== 音 ===================== */
var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tudum(){ if(LOC.mute) return; var a=ac(); if(!a) return;
  var t=a.currentTime;
  [[0,.16],[0.17,.5]].forEach(function(p,i){
    var o=a.createOscillator(), o2=a.createOscillator(), g=a.createGain();
    o.type='sine'; o2.type='triangle';
    o.frequency.setValueAtTime(73.4,t+p[0]); o2.frequency.setValueAtTime(146.8,t+p[0]);
    g.gain.setValueAtTime(.0001,t+p[0]);
    g.gain.exponentialRampToValueAtTime(i?.5:.38,t+p[0]+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+p[0]+p[1]);
    o.connect(g); o2.connect(g); g.connect(a.destination);
    o.start(t+p[0]); o2.start(t+p[0]); o.stop(t+p[0]+p[1]+.02); o2.stop(t+p[0]+p[1]+.02);
  }); }
function blip(f){ if(LOC.mute) return; var a=ac(); if(!a) return;
  var t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='square'; o.frequency.setValueAtTime(f||520,t);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.085,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+.11);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.13); }
function buzz(n){ if(navigator.vibrate) navigator.vibrate(n||18); }

document.addEventListener('input',function(ev){

},false);
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), t=today();

  if(a==='pick'){ var w=el.getAttribute('data-who');
    if(w==='kids'){ blip(300); return; }
    me=LOC.me=w; newTarget=(w==='rio'?'momoka':'rio'); saveLocal(); tudum();
    tab='home'; openId=null; reveal=null; render(); return; }
  if(a==='tab'){ tab=el.getAttribute('data-tab'); openId=null; reveal=null; buzz(); render(); window.scrollTo(0,0); return; }
  if(a==='open'){ openId=el.getAttribute('data-rule'); dTab='epi'; reveal=null; blip(620); render();
    detailEl.classList.add('open'); detailEl.scrollTop=0; return; }
  if(a==='close'){ openId=null; reveal=null; blip(420); render(); return; }
  if(a==='dtab'){ dTab=el.getAttribute('data-t'); render(); detailEl.classList.remove('open'); return; }

  if(a==='vio'){
    var rid=el.getAttribute('data-rule');
    addVio(me,rid,t); buzz(28); blip(200); render();
    detailEl.classList.remove('open'); return;
  }
  if(a==='undo'){
    var rid2=el.getAttribute('data-rule');
    if(subVio(me,rid2,t)) blip(340); else blip(180);
    reveal=null; render(); detailEl.classList.remove('open'); return;
  }
  if(a==='plan'){ var nv=!sent(t,me); addEv({k:'s',w:me,d:t,v:nv}); blip(nv?700:360); buzz();
    render(); detailEl.classList.remove('open'); return; }
  if(a==='planoff'){ addEv({k:'s',w:me,d:t,v:false}); blip(340); render();
    detailEl.classList.remove('open'); return; }

  if(a==='fav'){ var f=el.getAttribute('data-rule'), nf=!S.fav[f];
    addEv({k:'f',r:f,v:nf}); blip(nf?700:420); render(); detailEl.classList.remove('open'); return; }
  if(a==='rate'){ var g=el.getAttribute('data-rule'), ng=!S.rate[g];
    addEv({k:'rt',r:g,v:ng}); blip(ng?820:400); render(); detailEl.classList.remove('open'); return; }

  if(a==='prevm'){ vM--; if(vM<0){vM=11;vY--;} render(); return; }
  if(a==='nextm'){ vM++; if(vM>11){vM=0;vY++;} render(); return; }
  if(a==='day'){ selK=el.getAttribute('data-k'); blip(560); render(); return; }
  if(a==='sent'){ var w2=el.getAttribute('data-who');
    addEv({k:'s',w:w2,d:selK,v:!sent(selK,w2)}); blip(500); render(); return; }
  if(a==='step'){
    var w3=el.getAttribute('data-who'), r4=el.getAttribute('data-rule'), d=+el.getAttribute('data-d');
    if(d>0){ addVio(w3,r4,selK); blip(260); } else { if(subVio(w3,r4,selK)) blip(480); else blip(180); }
    render(); return; }

    var kk=selK.split('-'); vY=+kk[0]; vM=+kk[1]-1; render(); window.scrollTo(0,0); return; }

  if(a==='done'){
    addEv({k:'pc',id:el.getAttribute('data-id')});
    blip(880); buzz(); render(); return; }
  if(a==='lineshare'){
    var bx=document.getElementById('sentLayer');
    var msg=bx?bx.getAttribute('data-msg'):'';
    location.href='https://line.me/R/msg/text/?'+encodeURIComponent(msg);
    return; }
  if(a==='sentclose'){ sentBox=null; blip(420); render(); return; }
  if(a==='propose'){
    tab='list'; newTarget=(me==='rio'?'momoka':'rio'); openId=null; blip(660); render();
    window.scrollTo(0,0);
    setTimeout(function(){
      var f=document.getElementById('newPen');
      if(f){ try{ f.scrollIntoView({block:'center'}); }catch(e){} f.focus(); }
    },140);
    return; }
  if(a==='ackone'){
    addEv({k:'pv',id:el.getAttribute('data-id')});
    blip(760); buzz(); render(); return; }
  if(a==='toggle'){
    var tid=el.getAttribute('data-id');
    var isDone=S.doneList.some(function(p){ return p.id===tid; });
    addEv({k:isDone?'pu':'pc',id:tid});
    blip(isDone?360:880); buzz(); render(); return; }

  if(a==='tg'){
    newTarget=el.getAttribute('data-t');
    var inp=document.getElementById('newPen'); if(inp) draft=inp.value;
    Array.prototype.forEach.call(el.parentNode.children,function(b){
      b.setAttribute('aria-pressed', b===el?'true':'false'); });
    blip(560); return; }
  if(a==='add'){
    var inp2=document.getElementById('newPen'), tx2=(inp2?inp2.value:'').trim();
    if(!tx2){ blip(170); if(inp2) inp2.focus(); return; }
    addEv({k:'pa',w:me,id:'u'+uid(),tx:tx2,tg:newTarget});
    draft=''; blip(820); buzz(); render(); return; }
  if(a==='give'){
    var inp3=document.getElementById('newPen'), tx3=(inp3?inp3.value:'').trim();
    if(!tx3){ blip(170); if(inp3) inp3.focus(); return; }
    var nowd=new Date(), ds2=(nowd.getMonth()+1)+'/'+nowd.getDate();
    var tgs=(newTarget==='both')?['momoka','rio']:[newTarget];
    tgs.forEach(function(w){
      addEv({k:'pn',w:w,g:me,id:'g'+uid(),tx:tx3,no:0,d:ds2});
    });
    sentBox={text:tx3,to:(newTarget==='both'?(me==='rio'?'momoka':'rio'):newTarget)};
    draft=''; blip(900); buzz([22,46,22]); tudum(); render(); return; }
  if(a==='delpen'){
    var pid=el.getAttribute('data-id');
    addEv({k:'pd',id:pid}); blip(300); render(); return; }
  if(a==='switch'){ me=null; LOC.me=null; openId=null; reveal=null; saveLocal(); render(); return; }
  if(a==='sound'){ LOC.mute=!LOC.mute; saveLocal(); if(!LOC.mute) blip(700); render(); return; }
  if(a==='reset'){
    if(!confirm('二人ぶんの記録をすべて消します。よろしいですか？')) return;
    addEv({k:'zz'}); me=null; LOC.me=null; openId=null; reveal=null; saveLocal(); render(); return; }
},false);

/* ---- 新しい版が出ていたら、自動で入れ替わる ---- */
var BUILD='20260930-160036';
setTimeout(function(){
  try{
    if(sessionStorage.getItem('okite-reloaded')) return;
    fetch(location.pathname+'?cb='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var m=t.match(/name="app-build" content="([^"]+)"/);
      if(m&&m[1]&&m[1]!==BUILD){
        sessionStorage.setItem('okite-reloaded','1');
        location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
      }
    }).catch(function(){});
  }catch(e){}
},1200);

/* 自動更新で付いた ?v= は、読み込んだら消してURLを元に戻す */
try{ if(location.search) history.replaceState(null,'',location.pathname); }catch(e){}

unionEv(SEED); fold(); saveLocal();
render(); paintSync(); pull();
setInterval(function(){ if(!document.hidden) pull(); },3000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) pull(); },false);
window.addEventListener('online',function(){ pull(); },false);
})();
